name: Format Tiramisu Works LP

on:
  push:
    branches:
      - codex/tiramisu-works-lp-actual

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tiramisu-works-lp-actual
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Escape JSX apostrophe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/public/works/works-top-sections.tsx')
          text = path.read_text(encoding='utf-8')
          path.write_text(text.replace("Today's brief", "Today&apos;s brief"), encoding='utf-8')
          PY

      - name: Format Works files
        shell: bash
        run: |
          npx prettier --write \
            "src/app/(public)/works/page.tsx" \
            "src/app/(public)/works/works-styles.css" \
            "src/components/public/works-content.ts" \
            "src/components/public/works-integration-icon.tsx" \
            "src/components/public/works-links.ts" \
            "src/components/public/works/**/*.tsx" \
            "src/__tests__/e2e-playwright/works-lp.spec.ts"

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "src/app/(public)/works" \
            "src/components/public/works-content.ts" \
            "src/components/public/works-integration-icon.tsx" \
            "src/components/public/works-links.ts" \
            "src/components/public/works" \
            "src/__tests__/e2e-playwright/works-lp.spec.ts"
          git commit -m "style(lp): format Tiramisu Works files"
          git push origin HEAD:codex/tiramisu-works-lp-actual
